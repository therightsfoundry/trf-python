[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rightsfoundry"
version = "1.0.0"
description = "Official Python SDK for The Rights Foundry API: royalty-free music for commercial and creative sync, with 85,000+ tracks of cleared, human-made music to search and license as WAV masters in one call. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Rights Foundry", email = "info@therightsfoundry.com" }]
maintainers = [{ name = "The Rights Foundry", email = "info@therightsfoundry.com" }]
dependencies = []
keywords = [
  "music-licensing",
  "sync-licensing",
  "music-api",
  "royalty-free-music",
  "cleared-music",
  "audio-api",
  "soundtrack",
  "therightsfoundry",
  "audiosocket",
  "ai-video",
  "mcp",
  "music-rights",
  "wav",
  "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://therightsfoundry.com/"
Documentation = "https://docs.therightsfoundry.com/"
"API Reference" = "https://docs.therightsfoundry.com/"
"For Builders" = "https://therightsfoundry.com/for-builders"
"Dashboard & API Keys" = "https://therightsfoundry.com/dashboard/token"
"Licensing Terms" = "https://therightsfoundry.com/licensing"
"MCP Connector" = "https://mcp.therightsfoundry.com/mcp"
Repository = "https://github.com/therightsfoundry/trf-python"
Issues = "https://github.com/therightsfoundry/trf-python/issues"
Changelog = "https://github.com/therightsfoundry/trf-python/blob/main/CHANGELOG.md"
Security = "https://github.com/therightsfoundry/trf-python/security/policy"

[project.scripts]
rightsfoundry = "rightsfoundry._cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=5", "coverage>=7", "mypy>=1.11", "ruff>=0.6"]

[tool.uv]
# Dev lockfile targets supported Python >= 3.10 so pytest >= 9.0.3 (GHSA-6w46-j5rx-g56g patched) is locked;
# Python 3.9 runtime compatibility of the zero-dependency SDK is tested separately in CI.
environments = ["python_version >= '3.10'"]

[tool.hatch.build.targets.wheel]
packages = ["src/rightsfoundry"]

[tool.hatch.build.targets.sdist]
# Everything the test suite reads, so an unpacked sdist can run `pytest` on its own.
include = [
  "/src/rightsfoundry",
  "/tests",
  "/scripts",
  "/conformance",
  "/docs",
  "/examples",
  "/requirements",
  "/.github",
  "/action.yml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/llms.txt",
  "/llms-full.txt",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  # The one-time end-of-life notice on Python 3.9 is expected (tested explicitly).
  "ignore:rightsfoundry. Python 3.9 reached end-of-life:DeprecationWarning",
]

# Coverage is opt-in (`pytest --cov=rightsfoundry`), so plain `pytest` runs without pytest-cov installed.
[tool.coverage.run]
source = ["rightsfoundry"]
branch = false

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF", "C4", "PIE", "BLE"]
ignore = [
  "UP007",  # X | Y unions need 3.10 at runtime outside annotations
  "UP045",
  "RUF022", # __all__ is grouped by purpose, not sorted
  "RUF001", # typographic quotes/dashes in strings are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S301", "S603", "S607", "S310", "BLE001", "S104"]
"scripts/**" = ["S603", "S607", "S310"]
"examples/**" = ["S101", "T201"]
